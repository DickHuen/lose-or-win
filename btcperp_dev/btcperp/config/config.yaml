# BTC-PERP bot configuration.
# Do not edit this file by hand. Changes come back as a new zip with a
# higher config_version and a CHANGELOG entry.
config_version: "2.2.0"

market:
  # The instrument is resolved from GET /v1/info/instruments on every start.
  # The first symbol found in this list wins; if none match, the single
  # instrument with base_asset/quote_asset/category below is used.
  symbol_candidates: ["BTC-PERP", "BTC-USD"]
  base_asset: "BTC"
  quote_asset: "USD"
  category: "crypto"

polymarket:
  # Values from the official SDK polymarket-client 0.11.0 (environments.py).
  rest_url: "https://api.perpetuals.polymarket.com"
  ws_url: "wss://ws.perpetuals.polymarket.com/v1/ws"
  chain_id: 137
  geoblock_url: "https://polymarket.com/api/geoblock"
  http_timeout_seconds: 20
  command_timeout_seconds: 45
  book_depth: 10                 # allowed: 10, 100, 500, 1000
  order_status_poll_attempts: 6
  order_status_poll_interval_seconds: 1.0
  fills_lookback_hours: 48       # overlap when re-reading fills on reconcile
  kline_backfill_max_days: 30    # max 1h-kline backfill per run
  flat_confirm_delay_seconds: 5  # review C5: second position read before treating the account as flat
  collateral_asset_hint: ""      # empty = sum all balances' "value"

binance:
  spot_base_urls: ["https://api.binance.com", "https://data-api.binance.vision"]
  futures_base_urls: ["https://fapi.binance.com"]
  symbol: "BTCUSDT"
  http_timeout_seconds: 20
  daily_candles_to_load: 1000    # review C7: EMA200 within 0.1% of a full-history EMA200
  h4_candles_to_load: 300
  funding_days_to_load: 400      # spec minimum 365

# Alerts: every alert is stored, shown on the dashboard and (on Windows) popped up as a desktop
# notification. `run.py alerts` prints undelivered ones. Telegram is optional and OFF.
notifications:
  windows_toast: true
  analysis_toast: true           # v1.5.0: a one-line Windows notification with each decision's analysis
  analysis_toast_only_actions: true   # v1.9.0 (hourly) / v2.0.0 (15 min): only when a decision opens or closes

dashboard:
  port: 8765
  refresh_min_seconds: 60        # minimum gap between "refresh from exchange" snapshots
  auto_refresh_seconds: 300      # while the page is open, pull a fresh exchange snapshot this often

telegram:
  enabled: false
  api_base: "https://api.telegram.org"
  http_timeout_seconds: 20
  max_message_chars: 3900

schedule:
  # All times HKT (UTC+8). Used for the Task Scheduler, the entry window, run-lateness and the missed-run audit.
  # v2.0.0 (owner 2026-10-06, intraday): with intraday.enabled the bot runs ONE repeating task every
  # intraday_every_minutes (15), intraday_offset_minutes (1) after each 15-minute candle closes (HH:01, HH:16, HH:31,
  # HH:46 HKT). Every run reconciles, checks the SL / TP, manages the open position (break-even, trail, invalidation,
  # time stop) and then decides on a new entry. decide_times_hkt / manage_times_hkt are then empty: the old hourly
  # tasks (decide_HHMM, manage_HHMM) are removed by `schedule install`. (v1.9.0 rolling_1h: decide HH:30 / HH:50,
  # manage 02:10 ... 22:10.)
  intraday_every_minutes: 15
  intraday_offset_minutes: 1
  decide_times_hkt: []
  manage_times_hkt: []
  report_daily_time_hkt: "08:45"
  report_weekly: {weekday: "sunday", time_hkt: "20:00"}
  report_monthly: {rule: "first_sunday", time_hkt: "20:30"}
  backup_time_hkt: "03:00"
  entry_window_start_hkt: "08:30"        # cadence daily: the one entry window per day
  entry_window_end_hkt: "09:30"
  period_entry_start_minutes: 30         # cadence rolling_4h: entry window of each 4h period, minutes after the
  period_entry_end_minutes: 60           # boundary (v1.9.0 rolling_1h: 30-60 = HH:30-HH+1:00 HKT; rolling_4h used 90)
  late_tolerance_minutes: 5      # a run starting later than this counts as "late" (v2.0.0: 10 -> 5, 15-minute runs)
  missed_tolerance_minutes: 12   # no run within this window of a slot = "missed" (v2.0.0: 30 -> 12, below the 15-min step)
  # review v1.2.0 item 15: before a decision, this computer's clock is compared with the exchange's
  # server time; a larger difference (or an unreadable server time) blocks new positions that day.
  max_clock_skew_seconds: 30

strategy:
  # v1.5.0 (owner's choice, option B): rolling_4h = the same score and rules, decided every 4 hours on daily candles
  # that end at the decision time (not at 00:00 UTC). daily = v1.4 behaviour (one decision at 08:30 HKT).
  # v1.9.0 (owner 2026-10-02): rolling_1h = the same every hour (daily candles ending at each UTC hour, built
  # from 1h candles; the 3-day rule counts 72 hours). Was rolling_4h.
  cadence: "rolling_1h"
  # rolling_4h: a flip needs the opposite signal (|score| >= flip_min_abs_score) in this many consecutive periods
  # (1 = no confirmation, like daily). The backtest also runs 2 as variant R4h_confirm.
  flip_confirm_periods: 1
  ema_trend_period: 50
  ema_regime_period: 200
  atr_period: 14
  min_daily_candles: 200
  trend_weight: 50
  trend_atr_multiple: 2.0
  breakout_points: 25
  clv_weight: 25
  score_round_decimals: 4
  # |score| < tier_low_max -> tier_low_fraction; tier_low_max <= |score| <= tier_mid_max -> tier_mid_fraction; above -> tier_high_fraction
  # v1.8.0 (owner 2026-10-02): below 20 no new position. v1.9.0 (owner): size_tiers replaces the three tiers below:
  # [from |score|, fraction of risk.notional_multiple_full_tier 20]: 20-40 x3, 40-50 x6, 50-75 x10, 75 and above x20
  # equity. A gate against the trade (200-day line, 4h trend) caps the fraction at 0.50 = x10. null = the 3 tiers.
  # The tier_* values stay for the backtest / shadow "flat" variants and for size_tiers null.
  min_entry_abs_score: 20
  size_tiers: [[0, 0.15], [40, 0.30], [50, 0.50], [75, 1.00]]
  tier_low_max: 40
  tier_mid_max: 70
  tier_low_fraction: 0.15
  tier_mid_fraction: 0.50
  tier_high_fraction: 1.00
  flip_min_abs_score: 30
  opposite_days_rule: 3          # rolling_4h: 3 x 6 = 18 consecutive opposite 4h periods (72 h)
  # "Same direction: hold; SL/TP may only be tightened." Active tightening is OFF in v1.0.0;
  # the guard that refuses any loosening is always on.
  tighten_sl_on_same_direction: false

gates:
  regime_cap: 0.50
  h4_cap: 0.50
  h4_ema_fast: 20
  h4_ema_slow: 50
  funding_lookback_days: 365
  funding_high_percentile: 95
  funding_low_percentile: 5
  funding_cutoff_tolerance_minutes: 5
  event_anchor_hkt: "08:30"
  event_post_release_hours: 4
  calendar_file: "config/calendar.yaml"
  calendar_coverage_warn_days: 45
  # Event window: strategy flips are suppressed (hold). 3-day-rule and funding-rule
  # closes still execute; any new entry is blocked.
  event_allows_rule_closes: true

exits:
  # v1.10.0 (owner 2026-10-04: "the target is too far, the smaller swings are missed"): the SL / TP follow the
  # current HOURLY swings: the multiples apply to the Wilder ATR(atr_1h_period) of the 1h candles closed at the
  # decision period's start (atr_source "1h"), with floors of sl_min_pct / tp_min_pct of the price (the round-trip
  # fees, ~0.08% of the position = ~1.6% of equity at x20, must be covered). Quiet market (1h ATR ~0.3%): SL ~0.6%,
  # TP ~0.9%. atr_source "daily" = the daily ATR of the score (v1.8.1: SL 1.0 / TP 1.5 daily ATR, ~2.7% / ~4%;
  # before that 1.5 / 3.0).
  atr_source: "1h"
  atr_1h_period: 14
  sl_atr_multiple: 2.0
  tp_atr_multiple: 3.0
  sl_min_pct: 0.5
  tp_min_pct: 0.8
  entry_slippage_bps: 10
  entry_attempts: 1              # FOK attempts per day. 1 until the smoketest has recorded the exchange's
                                 # real "FOK not filled" status (review v1.2.0 item 10); then 2 is allowed
  close_slippage_bps: 50         # reduce-only IOC limit allowance
  close_attempts: 3              # last attempt is a market-style IOC (no price)

intraday:
  # v2.0.0 (owner 2026-10-06: "適合日內短炒，能處理升浪及跌浪，捕捉扣除成交成本後仍有空間的波幅"). Replaces the daily-score
  # decisions for trading (strategy.* score rules stay for the old backtest / preview only). Fixed rules from the
  # Codex verification report (2026-10-06): 15m pullback / breakout versions lost after costs mainly because stops of
  # ~0.2-0.5% made the round-trip cost ~0.4-0.9 R, and breakouts were chased. So: 1h structure for direction (long and
  # short mirror-symmetric), 15m only for the trigger, stops at structure but never so close that costs exceed
  # max_cost_r of R, an entry only when the room to the next level fits TP1, one entry per leg. Not tuned to any day.
  # See perpbot/intraday.py for the exact rules and INTRADAY.md for the explanation in Chinese.
  enabled: true
  cache_backfill_days: 25          # first run: Binance 15m / 1h / 4h candles this far back, then only new ones
  entry_max_delay_minutes: 10      # an entry only within this many minutes after the 15m candle closed
  # --- structure (1h) and background (4h)
  swing_k: 2                       # swing high / low: beyond 2 candles on each side (confirmed 2 hours later)
  structure_lookback_hours: 72
  atr_period: 14                   # Wilder ATR on 1h and on 15m candles
  er_hours: 24                     # trend efficiency (net move / path) over 24 1h closes
  ctx_ema_fast: 20                 # 4h EMA 20 / 50 and the fast EMA's slope over 3 candles: background for sizing only
  ctx_ema_slow: 50
  ctx_slope_bars: 3
  # --- setups
  # v2.1.0 / v2.2.0 (owner 2026-10-07: "唔好太嚴，我要博多啲、食多啲波幅", then "再放多啲"): looser than v2.0.0
  # (v2.0.0 values in brackets).
  leg_min_atr: 0.75                # continuation: the leg from the last swing at least 0.75 x ATR1h (1.5)
  retrace_min: 0.236               # continuation: pullback between 23.6% (38.2%) and 88.6% (78.6%) of the leg
  retrace_max: 0.886
  pullback_max_bars: 16            # the pullback / retest / range-edge extreme within the last 16 15m candles (8)
  trigger_clv_min: -0.2            # 15m trigger closes above 40% of its range for a long (0.0: the outer half)
  trigger_beyond: "close"          # the trigger closes beyond the previous 15m candle's CLOSE ("high_low": its high / low)
  reversal_window_hours: 12        # reversal: retest within 12 (6) hours of the 1h close that broke the structure
  retest_zone_atr: 0.5             # reversal: price back within 0.5 (0.25) x ATR1h of the broken level
  reclaim_atr: 0.5                 # reversal cancelled by a 15m close 0.5 (0.25) x ATR1h back beyond the level
  range_enabled: true              # v2.1.0: fade the edges of a sideways market (v2.0.0: no trade in a range)
  range_min_atr: 1.5               # range: at least 1.5 x ATR1h from the low to the high (v2.1.0: 2.0)
  range_edge_atr: 0.5              # range: price came within 0.5 x ATR1h of the edge (v2.1.0: 0.35)
  # --- stop, targets, room, costs
  stop_buffer_atr15: 0.25          # stop 0.25 x ATR15 beyond the setup's extreme
  sl_min_atr1h: 0.75               # stop at least 0.75 (1.0) x ATR1h ...
  sl_min_pct: 0.3                  # ... and at least 0.3% (0.5%) of the price ...
  max_cost_r: 0.35                 # ... and so far that the round-trip cost is at most 0.35 (0.20) R (else no entry)
  sl_max_atr1h: 3.0                # wider than 3 x ATR1h or 2% = too far from the structure: no entry
  sl_max_pct: 2.0
  tp1_r: 0.8                       # leg A target 0.8 R (1.0) (tp1_fraction of the position)
  tp1_fraction: 0.5
  tp2_r: 3.0                       # leg B (runner) target 3 R
  room_recent_bars: 8              # obstacles: 1h swing levels (72 h) and the last 8 (16) 15m candles' extreme
  open_room_atr: 3.0               # nothing in the way: room 3 x ATR1h
  # --- management (every 15-minute run)
  invalidation_timeframe: "1h"     # before TP1 / break-even: a 1h CLOSE beyond the setup's level (pullback low / high,
                                   # retest extreme) exits at market; 1h, not 15m, so it is not just a tighter stop
  trail_atr1h: 2.0                 # runner stop: 2 x ATR1h behind the best price since entry, never back
  trail_min_step_atr15: 0.25       # move the exchange stop only in steps of at least 0.25 x ATR15
  be_trigger_r: 1.0                # single-leg trade: stop to break-even + costs once the best move reaches 1 R
  max_hold_hours: 12               # time stop
  no_progress_hours: 6             # before TP1: exit after 6 h if the best move is still below 0.5 R
  no_progress_mfe_r: 0.5
  cooldown_bars: 0                 # a new entry may follow right after an exit (2 candles)
  max_entries_per_day: 12          # (6)
  max_entries_per_leg: 3           # the same leg / range edge at most 3 times (1)
  # --- conviction score 0-100 (sizing only, through strategy.size_tiers: 20-40 x3, 40-50 x6, 50-75 x10, 75+ x20)
  score_base_continuation: 35
  score_base_reversal: 25
  score_base_range: 20             # v2.1.0: range fades start lowest (x3 unless the 4h background agrees)
  score_trend: 20                  # x trend efficiency (continuation) or x break depth / break_full_atr (reversal)
  score_ctx_aligned: 25            # 4h background with the trade; neutral 10; against 0 (never blocks)
  score_ctx_neutral: 10
  score_room: 10                   # room from TP1 (0) to score_room_full_r R (full)
  score_room_full_r: 3.0
  score_cost: 10                   # x (1 - cost R / max_cost_r)
  break_full_atr: 1.0
  # --- costs (all fills taker; costs.py)
  stop_slippage_bps: 5             # extra slippage of a triggered stop
  funding_hold_hours: 6            # funding counted for 6 hours when the position pays it
  fee_min_fills: 3                 # the account's measured taker rate needs at least 3 recent taker fills
  cost_book_depth: 100             # order-book levels read for the depth / slippage estimate
  # --- event blackout (replaces the whole-day event gate for intraday entries)
  event_block_before_minutes: 30
  event_block_after_minutes: 60

bold:
  # v1.7.0 (owner 2026-10-02: "I want to gamble", high return, "keep going until I say stop"). Each entry is one
  # all-in bet in the direction of the strategy's signal: position = equity x notional_multiple, isolated at
  # risk.leverage. TP where equity doubles after both taker fees (~+5.4% at 19x), SL where the loss incl. fees is
  # max_loss_fraction of equity (~-3.6%); the liquidation estimate (~4% at 20x on BTC-USD) must lie beyond the SL
  # by liq_buffer_pct. hold_until_tp_sl: flips, the 3-day rule and the funding / flat rules do not close a bet.
  # risk_per_trade_pct, tiers, notional cap, raise_to_min and liq_min_sl_multiple do not apply while enabled.
  enabled: false                 # v1.8.0 (owner 2026-10-02): off - back to the analysis rules with bigger positions
  notional_multiple: 19          # x equity (20x isolated leaves ~5% of equity for fees)
  target_multiple: 2.0           # TP: equity x 2 after fees
  max_loss_fraction: 0.70        # SL: lose 70% of equity incl. fees
  liq_buffer_pct: 0.3            # liquidation estimate at least 0.3% of the price beyond the SL
  hold_until_tp_sl: true

risk:
  # v1.5.7 (owner 2026-10-02, "more aggressive; small capital must still trade"): no half-size ramp (was 10 trades
  # at 0.5x), and sizes below the exchange minimum are raised to it while the risk stays within the 100%-tier
  # budget. v1.5.8 (owner 2026-10-02, "5%"): 5% at the 100% tier (the maximum this config allows; was 2, before
  # that 1.5), notional cap 150% so a full-tier trade is not cut down. The backtest's R numbers do not change; its
  # % returns and drawdowns scale by about 5/1.5 (run #1 max drawdown 10.9% -> about 36%).
  risk_per_trade_pct: 5.0        # at the 100% tier
  ramp_trades: 0                 # first N live trades use ramp_factor x risk (0 = no ramp)
  ramp_factor: 0.5
  # v1.5.9 (owner 2026-10-02): 10x isolated (was 3x). Sizing is by risk, so the size and the loss at the stop do
  # not change; only the margin (~10% of notional) and the liquidation distance (~9% at BTC-USD's max 50x) do.
  # liq_min_sl_multiple still refuses an entry, or closes a fill, whose liquidation is nearer than 2 x the stop.
  # v1.9.0 (owner 2026-10-02, positions up to 20 x equity): with notional_multiple_full_tier set, the leverage is
  # chosen PER TRADE (risk.trade_leverage): the lowest that fits the margin in max_margin_use_pct of equity
  # (x3 -> 4x, x6 -> 7x, x10 -> 11x, x20 -> 22x), so the liquidation lies as far away as possible. The profit and
  # loss depend on the position, not on the leverage. `leverage` is then the maximum per trade. If at that leverage
  # the liquidation estimate (1/leverage - 0.5/50 on BTC-USD) is not liq_min_sl_multiple x the stop away, the
  # position is cut until it is (volatility cap: with the 1.0 ATR stop at ATR 2.6% x20 fits; at ATR 3% about x18).
  # Before: 12x for every trade (v1.8.x), 20x bold (v1.7.0), 10x (v1.5.9), 3x.
  leverage: 25
  max_margin_use_pct: 92         # v1.9.0: margin per trade at most 92% of equity (the rest pays the fees)
  # v1.8.0 (owner 2026-10-02, "more when confident"): position = equity x this x the tier fraction (strategy
  # size_tiers after the gate caps). v1.9.0: 20 (was 10): x3 / x6 / x10 / x20. Loss at the 1.0 ATR stop at ATR 2.6%:
  # x20 ~ 53% of equity, gain at the 1.5 ATR target ~ 79%. null = size by risk_per_trade_pct (v1.5.x). While set,
  # risk_per_trade_pct and notional_cap_pct_equity are not used; the leverage cap and liq_min_sl_multiple still are.
  notional_multiple_full_tier: 20
  cross_margin: false            # false = isolated
  notional_cap_pct_equity: 150   # owner 2026-10-02 (was 60, before that 30); 10x isolated allows up to 1000%
  raise_to_min_notional: true    # v1.5.7: below-minimum sizes go up to the exchange minimum if risk <= 100%-tier budget
  liq_min_sl_multiple: 1.3      # v1.9.0 (1.5 in v1.8.x, 2.0 before): the liquidation estimate at least 1.3 x the stop away
  liq_after_fill_sl_multiple: 1.15   # v1.9.0: the exchange's liquidation price after the fill; null = liq_min_sl_multiple
  # Pre-trade liquidation ESTIMATE only: maintenance margin rate = 0.5 / instrument max_leverage
  # (= 1 / (divisor * max_leverage) with divisor 2; formula as cited by the review, not verified by
  # the developer). The authoritative check runs after the fill on the exchange's liquidation_price;
  # a missing / zero liquidation price on an isolated position fails the check (review D10).
  liq_estimate_mmr_divisor: 2
  # v1.7.0 / v1.8.0 (owner 2026-10-02: no automatic stop, "I tell you when to stop"): 95 = effectively off. At 6 x
  # equity a full-tier stop loses ~24%, so the old 25% line would stop the bot after about one loss.
  kill_drawdown_pct: 95          # v1.7.0 (was 25, before that 15)
  kill_losing_streak_pct: 95     # v1.7.0 (was 20, before that 8)
  # review D11: a trade whose net PnL is within +/- this % of equity at entry is a "tie": it neither
  # ends nor extends a losing streak (the backtest uses the same rule).
  losing_streak_tie_pct: 0.1
  # Hard stop (review E): equity below this % of net funded capital (first equity seen + net
  # confirmed deposits/withdrawals) closes the position and pauses; `resume` cannot clear it.
  # Clearing it needs a new config version that ALSO states the new funded baseline in USD below
  # (review v1.2.0 item 7: never re-based automatically on the current equity). Owner confirmed 2026-09-30.
  # v1.7.0 (owner 2026-10-02): 5% - the bot keeps betting until almost everything is gone or the owner stops it.
  equity_floor_pct_of_net_funded: 5   # v1.7.0 (was 75)
  equity_floor_reset_baseline_usd: null   # null = the equity floor cannot be cleared
  equity_floor_reset_for: null            # review v1.3.0 F2: the trigger date (YYYY-MM-DD HKT) the baseline is for; single use
  # review v1.3.0 F1: permanent floor on ALL capital ever funded (first equity + every confirmed deposit minus
  # withdrawal, never re-based). Below it: close and stop for good. A new config may never lower this %;
  # only a new config version that sets permanent_floor_reset_for = the trigger date restarts it.
  # v1.7.0 - v1.10.0 (owner 2026-10-02): lowered from 50 to 5. permanent_floor_lowered_in names the ONE config version
  # allowed to lower it (the bot otherwise refuses a config that lowers this %); a later config cannot reuse it.
  permanent_floor_pct_of_cumulative_funded: 5     # v1.7.0 (was 50)
  permanent_floor_lowered_in: "1.10.0"
  permanent_floor_reset_for: null
  # review v1.3.0 S9: live review line. After live_review_min_trades live trades, if the rolling
  # live_review_window_trades expectancy falls below this value (the backtest's I6 5th percentile, set in a
  # new config version after the backtest), new entries pause until the owner reviews. null = not set yet.
  # v1.5.7: -0.196 = I6 of R4h_live, backtest run #1 (2026-09-30). v1.7.0: off (owner: no automatic stop).
  live_review_min_trades: 30
  live_review_window_trades: 30
  live_review_expectancy_floor_r: null
  expectancy_window_trades: 25
  # Mark-to-market equity source, used for BOTH the peak and the current value (review C8).
  # total_account_value = the exchange's own account value (collateral incl. margin + uPnL).
  # wallet + uPnL is computed as a cross-check; a disagreement > tolerance blocks new entries
  # and alerts. An unreadable equity skips the kill-switch evaluation for that run and alerts.
  equity_source: "total_account_value"   # total_account_value | wallet_plus_upnl
  equity_crosscheck_tolerance_pct: 0.5
  funding_payment_sign: 1        # +1: API "funding" > 0 is a credit to us (verify in smoketest)

key:
  expiry_warn_days: 5

lock:
  wait_seconds: 900

logging:
  level: "INFO"

shadow:
  enabled: true
  gate_trade_max_hold_days: 5
  fee_rate_estimate: 0.0005      # used only when /v1/info/fees is unavailable
  breakeven_trigger_atr: 1.0     # V2: one-time SL move to breakeven at +1 ATR

backtest:
  # Review B3 / v1.2.0 item 1. Pre-registered design (BACKTEST.md); runs with THIS config's strategy
  # values, no tuning. Pass/fail rules: backtest_criteria.yaml, confirmed by the owner BEFORE the run.
  data_start: "2017-08-17"               # Binance BTCUSDT history starts here; funding starts 2019-09-10.
                                         # 1000 daily candles before the first window, exactly like live (C7)
  first_window_start: "2020-10-01"       # needs 365 days of funding history before it
  window_months: 6
  start_offsets_days: [0, 7, 14, 21, 28]
  start_equity_usd: 10000
  kill_pause_days: 14                    # drawdown / losing-streak kill: pause, then resume (peak reset)
  exit_slippage_bps: 10                  # every exit (SL/TP/rule close); entries use exits.entry_slippage_bps
  stress_exit_slippage_bps: 30           # review BT3 stress twins (also: fees x2, paid funding x2)
  # review C1(c): the full period in three segments; C1(c) needs >= 2 with a positive median expectancy
  segments: [["2020-10-01", "2022-10-01"], ["2022-10-01", "2024-10-01"], ["2024-10-01", "2026-10-01"]]
  rolling_trades: 30                     # I6 / S9: rolling expectancy over this many trades
  polymarket_start: "2025-01-01"         # I7: Polymarket's own 1h candles are downloaded from here (what exists)
  pm_replay_min_days: 30                 # I7 runs only with at least this much Polymarket data
  quantity_decimals: 4
  calendar_history_file: "config/calendar_history.yaml"
