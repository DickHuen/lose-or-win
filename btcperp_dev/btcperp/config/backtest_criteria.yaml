# Backtest pass/fail rules (review B3). draft-4 (v1.6.0): draft-3 plus I8, the 2-hour cadence (R2h_live, backtest
# only) against the live 4-hour one. draft-3 (v1.5.0): draft-2 (the committee's v1.3.0 ruling C0-C7, I1-I7 as
# adopted by the developer; REVIEW_v1.3.0.md explains C0b/C0c) applied to the owner's choice, option B: the primary
# variant is R4h_live (strategy.cadence rolling_4h). The rules themselves are unchanged; I1 now compares the 4h
# cadence with the v1.4 daily one, I2/I3b use the rolling variants.
# The owner confirms with `backtest confirm` (windows\Backtest.bat, type CONFIRM) after reading this file (the
# committee was dissolved on 2026-09-30). The confirmation locks this file, the strategy / risk / backtest config,
# both calendars, the code, the data slice (fixed end date) and the fee rate (review R1); `backtest run` refuses any
# change and numbers each run under the confirmation - run #1 counts.
# Everything is on the primary variant R4h_live unless stated; `use_twin` reads its stress twin (R4h_live_stress).
criteria_version: "draft-4 (2026-10-02)"
primary_variant: R4h_live
rules:
  # ---- C0 data completeness (review R2)
  - {id: C0a, scope: data, metric: h1_missing_share, op: "<=", value: 0.001,
     text: "1h candles missing over the test period <= 0.1%"}
  - {id: C0b, metric: holding_gap_hours_max, op: "<=", value: 3,
     text: "No gap longer than 3 h in 1h data while a position is open (each gap is filled conservatively: worse of SL and next open)"}
  - {id: C0c, metric: holding_gap_hours_total_full_max, op: "<=", value: 6,
     text: "Total missing hours while holding, per full-period run (worst offset) <= 6 h"}
  # ---- C1 edge (all four)
  - {id: C1a, metric: full_expectancy_r_min, op: ">=", value: 0.05,
     text: "Full period, EVERY start offset: size-weighted expectancy after costs >= +0.05 R"}
  - {id: C1b, use_twin: true, metric: full_expectancy_r_min, op: ">", value: 0,
     text: "Stress twin (fees x2, 30 bps exit slippage, paid funding x2), EVERY offset: expectancy > 0 R"}
  - {id: C1c, metric: segments_positive, op: ">=", value: 2,
     text: "Of the 3 segments (2020-10..2022-09, 2022-10..2024-09, 2024-10..2026-09), >= 2 with offset-median expectancy > 0 R"}
  - {id: C1d, metric: t_stat_median_offset, op: ">=", value: 2.0,
     text: "Median-offset full run: t-statistic of per-trade R >= 2.0"}
  # ---- C2-C7
  - {id: C2a, metric: window_positive_share_median, op: ">", value: 0.5,
     text: "6-month windows with a positive return: median share over offsets > 50%"}
  - {id: C2b, metric: window_return_pct_median, op: ">", value: 0,
     text: "Median 6-month window return > 0%"}
  - {id: C3, metric: window_max_drawdown_pct_max, op: "<=", value: 20,
     text: "Worst intraday (hourly) max drawdown in any window / offset <= 20%"}
  - {id: C4, metric: floor_hits_total, op: "==", value: 0,
     text: "Equity floor (-25% of starting equity) never hit"}
  - {id: C5, metric: full_trades_median, op: ">=", value: 60,
     text: "Full period: median trades over offsets >= 60"}
  - {id: C6, metric: full_max_drawdown_pct_max, op: "<=", value: 25,
     text: "Full period incl. automatic resumes: worst intraday max drawdown over offsets <= 25%"}
  - {id: C7, metric: drawdown_kills_full_median, op: "<=", value: 3,
     text: "Drawdown kill-switch triggers per full-period run: median over offsets <= 3"}
  # ---- informational
  - {id: I1, informational: true, metric: full_total_r_median, metric_minus: {variant: A_live, metric: full_total_r_median},
     op: ">", value: 0, text: "4h cadence adds value: R4h_live minus A_live (v1.4 daily), full-period total R (median)"}
  - {id: I2, metric: full_expectancy_r_min, metric_minus: {variant: R4h_live_noevents, metric: full_expectancy_r_min},
     op: report, text: "Calendar sensitivity: R4h_live minus R4h_live_noevents, expectancy R (min over offsets) - value only"}
  - {id: I3a, metric: streak_loss_pct_p99, op: report, text: "Losing-streak loss p99 (% of equity), with kill switches"}
  - {id: I3b, variant: R4h_live_nokill, metric: streak_loss_pct_p99, op: report,
     text: "Losing-streak loss p99 WITHOUT kill switches (BT4: not truncated by the 8% kill)"}
  - {id: I4, informational: true, metric: notional_cap_binding_share_median, op: "<=", value: 0.5,
     text: "Share of trades capped by the 30% notional cap (median) <= 0.5 - else review the 30% cap"}
  - {id: I5, informational: true, metric: short_all_offsets_negative, op: "==", value: false,
     text: "Short trades: expectancy negative at every offset? (true = committee discussion, no automatic change)"}
  - {id: I6, metric: rolling_expectancy_r_p5, op: report,
     text: "Rolling 30-trade expectancy, 5th percentile (R) - becomes the live review line (S9)"}
  - {id: I7, informational: true, scope: data, metric: pm_exit_agreement, op: ">=", value: 0.9,
     text: "Polymarket-candle replay vs Binance: same exit reason and day for >= 90% of trades (where data exists)"}
  - {id: I8, informational: true, variant: R2h_live, metric: full_total_r_median,
     metric_minus: {variant: R4h_live, metric: full_total_r_median}, op: ">", value: 0,
     text: "2h cadence adds value: R2h_live minus R4h_live (live, every 4h), full-period total R (median)"}
