# Macro event calendar for the event-window gate.
# Times are US Eastern local time (America/New_York); the bot converts to UTC
# with the correct daylight-saving offset for each date.
#
# Sources (checked 2026-09-26):
#   FOMC: federalreserve.gov "Meeting calendars and information" and press
#         releases of 2024-08-09 (2025-2026 schedule) and 2025-09-05 (2027 schedule).
#         Statement at 14:00 ET on the second day of each meeting.
#   CPI:  bls.gov/schedule/news_release/cpi.htm and monthly schedule pages (08:30 ET).
#   NFP:  bls.gov/schedule/news_release/empsit.htm and monthly schedule pages (08:30 ET).
#
# NOT YET PUBLISHED: BLS publishes the 2027 CPI and Employment Situation schedules
# late in the year. Until they are added, CPI/NFP coverage ends 2026-12-31 and the
# bot alerts you (daily report + monthly report) that the calendar needs an update.
# Updates arrive as a new zip version; do not edit this file by hand.
calendar_version: "2026-09-26"
timezone: "America/New_York"

coverage_end:
  FOMC: "2027-12-31"
  CPI: "2026-12-31"
  NFP: "2026-12-31"

events:
